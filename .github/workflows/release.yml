name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: ./build.sh "${GITHUB_REF_NAME}"
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --title "netlight ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "netlight ${GITHUB_REF_NAME}" --generate-notes
          fi
